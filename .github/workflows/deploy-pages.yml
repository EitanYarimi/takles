name: Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Restore distill caches
        uses: actions/cache@v4
        with:
          path: |
            distill_cache.json
            article_cache.json
          key: distill-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            distill-${{ runner.os }}-
      - name: Fetch news feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-flash-latest
          DISTILL_MAX_GEMINI: "10"
        run: python3 scripts/build_news.py
        timeout-minutes: 25
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html news.json insights.json _site/
          cp -R media _site/media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
